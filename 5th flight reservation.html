<!DOCTYPE html>
<html>
<head>
    <title>Flight Reservation System</title>
    <style>
        body {
            font-family: Arial;
            background: #eef3f8;
            text-align: center;
        }
        h1 { background: navy; color: white; padding: 15px; }
        .box {
            background: white;
            padding: 15px;
            margin: 15px auto;
            width: 85%;
            max-width: 500px;
            border-radius: 10px;
        }
        input, select, button {
            padding: 10px;
            margin: 5px;
        }
        button { background: navy; color: white; border: 0; cursor: pointer; }
        #result { margin: 20px; }
    </style>
</head>
<body>

<h1>Flight Reservation System</h1>

<div class="box">
    <h2>User Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="alert('Contact administrator to reset password')">
        Forgot Password
    </button>
    <p id="msg"></p>
</div>

<div class="box">
    <h2>Search Flight</h2>
    <input id="from" placeholder="From">
    <input id="to" placeholder="Destination">
    <input id="date" type="date">
    <select id="class">
        <option>Economy</option>
        <option>Business</option>
        <option>First Class</option>
    </select>
    <button onclick="searchFlight()">Search</button>
    <div id="result"></div>
</div>

<div class="box">
    <h2>Book Ticket / Payment</h2>
    <input id="passenger" placeholder="Passenger Name">
    <input id="seat" placeholder="Seat Number (e.g. A1)">
    <button onclick="bookTicket()">Book & Pay</button>
    <p id="ticket"></p>
</div>

<div class="box">
    <h2>My Ticket / Booking Status</h2>
    <input id="pnr" placeholder="Enter PNR">
    <button onclick="checkTicket()">View Status</button>
    <button onclick="printTicket()">Print Ticket</button>
    <button onclick="cancelTicket()">Cancel Ticket</button>
    <p id="status"></p>
</div>

<div class="box">
    <h2>Customer Feedback</h2>
    <textarea id="feedback" placeholder="Enter feedback"></textarea>
    <button onclick="sendFeedback()">Submit Feedback</button>
</div>

<div class="box">
    <h2>Admin Report</h2>
    <button onclick="report()">View Report</button>
    <p id="report"></p>
</div>

<script>
let loggedIn = false;
let selectedFlight = null;
let bookings = [];
let flights = [
    { id: 101, from: "Chennai", to: "Delhi",
      date: "2026-10-15", fare: 4500, seats: 20 },
    { id: 102, from: "Bangalore", to: "Mumbai",
      date: "2026-10-16", fare: 3500, seats: 15 }
];

function login() {
    if (user.value && pass.value) {
        loggedIn = true;
        msg.innerHTML = "Login successful!";
    } else {
        msg.innerHTML = "Enter username and password.";
    }
}

function searchFlight() {
    let f = flights.find(x =>
        x.from.toLowerCase() === from.value.trim().toLowerCase() &&
        x.to.toLowerCase() === to.value.trim().toLowerCase() &&
        x.date === date.value
    );

    if (f && f.seats > 0) {
        selectedFlight = f;
        result.innerHTML =
            "Flight " + f.id + "<br>Fare: Rs." + f.fare +
            "<br>Available seats: " + f.seats +
            "<br>Class: " + document.getElementById("class").value;
    } else {
        selectedFlight = null;
        result.innerHTML = "No flights available.";
    }
}

function bookTicket() {
    if (!loggedIn) {
        alert("Please login first.");
        return;
    }
    if (!selectedFlight || selectedFlight.seats <= 0 ||
        !passenger.value.trim() || !seat.value.trim()) {
        alert("Search a flight and enter passenger name and seat.");
        return;
    }

    if (bookings.some(b => b.flight.id === selectedFlight.id &&
        b.seat === seat.value.trim() && !b.cancelled)) {
        alert("Seat already booked.");
        return;
    }

    if (!confirm("Pay Rs." + selectedFlight.fare + "?")) {
        return;
    }

    let b = {
        pnr: "PNR" + Math.floor(10000 + Math.random() * 90000),
        name: passenger.value.trim(),
        seat: seat.value.trim(),
        flight: selectedFlight,
        cancelled: false
    };

    bookings.push(b);
    selectedFlight.seats--;

    ticket.innerHTML = "Payment successful! PNR: " + b.pnr;
    pnr.value = b.pnr;
}

function checkTicket() {
    let b = bookings.find(x => x.pnr === pnr.value.trim());
    status.innerHTML = b ?
        (b.cancelled ? "Ticket cancelled." :
        "Confirmed | " + b.name + " | " + b.flight.from +
        " to " + b.flight.to + " | Seat: " + b.seat +
        " | Fare: Rs." + b.flight.fare) :
        "Ticket not found.";
}

function cancelTicket() {
    let b = bookings.find(x => x.pnr === pnr.value.trim());
    if (!b || b.cancelled) {
        status.innerHTML = "Valid booking not found.";
        return;
    }
    b.cancelled = true;
    b.flight.seats++;
    status.innerHTML = "Ticket cancelled. Refund is not processed in this demo.";
}

function printTicket() {
    let b = bookings.find(x => x.pnr === pnr.value.trim() && !x.cancelled);
    if (b) {
        status.innerHTML = "E-TICKET<br>PNR: " + b.pnr +
            "<br>Name: " + b.name +
            "<br>Flight: " + b.flight.from + " to " + b.flight.to +
            "<br>Seat: " + b.seat + "<br>Fare: Rs." + b.flight.fare;
        window.print();
    } else {
        status.innerHTML = "No confirmed ticket to print.";
    }
}

function sendFeedback() {
    if (feedback.value.trim()) {
        alert("Thank you for your feedback!");
        feedback.value = "";
    } else {
        alert("Please enter feedback.");
    }
}

function report() {
    reportText = "Total flights: " + flights.length +
        "<br>Total bookings: " + bookings.filter(b => !b.cancelled).length;
    document.getElementById("report").innerHTML = reportText;
}
</script>

</body>
</html>
