
<!DOCTYPE html>
<html>
<head>
<title>Home Finder</title>
<style>
body{font-family:Arial;text-align:center;background:#eef2f7;padding:20px}
.box{background:white;padding:20px;max-width:550px;margin:auto}
input,button{padding:10px;margin:6px}
button{background:#16803c;color:white;border:0}
</style>
</head>
<body>
<div class="box">
<h2>Home Finder</h2>
<input id="search" placeholder="Enter location">
<button onclick="searchHome()">Search</button>
<div id="properties"></div>
<p id="result"></p>
</div>
<script>
let homes=[
{type:"House",location:"Chennai",price:2500000},
{type:"Land",location:"Krishnagiri",price:800000},
{type:"Flat",location:"Bangalore",price:3000000}
];
function searchHome(){
let s=document.getElementById("search").value.toLowerCase();
let found=homes.filter(x=>x.location.toLowerCase().includes(s));
document.getElementById("properties").innerHTML=found.map(x=>
`${x.type} - ${x.location} - Rs.${x.price}
<button onclick="viewHome('${x.type}','${x.location}',${x.price})">View</button>`
).join("<hr>")||"No properties found";
}
function viewHome(type,location,price){
document.getElementById("result").innerText=
"Property: "+type+" | Location: "+location+" | Price: Rs."+price;
}
searchHome();
</script>
</body>
</html>
