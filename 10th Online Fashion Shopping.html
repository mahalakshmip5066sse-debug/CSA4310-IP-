
<!DOCTYPE html>
<html>
<head>
    <title>StyleHub</title>
    <style>
        body{font-family:Arial;background:#f2f2f2;text-align:center;padding:20px}
        .box{background:white;padding:20px;max-width:500px;margin:auto;border-radius:10px}
        button{padding:8px;margin:5px;background:#2563eb;color:white;border:0}
        input,select{padding:9px;margin:5px}
    </style>
</head>
<body>
    <div class="box">
        <h2>StyleHub - Fashion Store</h2>
        <input id="search" placeholder="Search product">
        <button onclick="showProducts()">Search</button>
        <div id="products"></div>
        <h3>Shopping Cart</h3>
        <div id="cart">No items selected</div>
        <input id="name" placeholder="Customer Name">
        <button onclick="order()">Place Order</button>
        <p id="result"></p>
    </div>
<script>
let items=[{name:"Shirt",price:500},{name:"Shoes",price:1200},
{name:"Bag",price:800}];
let cart=[];
function showProducts(){
let s=document.getElementById("search").value.toLowerCase();
document.getElementById("products").innerHTML=items
.filter(x=>x.name.toLowerCase().includes(s))
.map(x=>`${x.name} - Rs.${x.price}
<button onclick="add('${x.name}')">Add</button>`).join("<br>");
}
function add(name){
cart.push(items.find(x=>x.name===name));
document.getElementById("cart").innerText=
cart.map(x=>x.name+" - Rs."+x.price).join(", ");
}
function order(){
let n=document.getElementById("name").value;
if(!n||cart.length===0){alert("Enter name and select products");return;}
let total=cart.reduce((sum,x)=>sum+x.price,0);
document.getElementById("result").innerText=
"Order placed for "+n+". Total: Rs."+total;
}
showProducts();
</script>
</body>
</html>
