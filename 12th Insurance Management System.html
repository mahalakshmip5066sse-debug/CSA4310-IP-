
<!DOCTYPE html>
<html>
<head>
<title>InsureEasy</title>
<style>
body{font-family:Arial;background:#edf6ff;text-align:center;padding:20px}
.box{background:white;padding:25px;max-width:450px;margin:auto}
input,select,button{padding:10px;margin:8px;width:80%}
button{background:#1769aa;color:white;border:0}
</style>
</head>
<body>
<div class="box">
<h2>InsureEasy</h2>
<input id="name" placeholder="Customer Name"><br>
<input id="email" type="email" placeholder="Email Address"><br>
<select id="policy">
<option>Health Insurance</option>
<option>Vehicle Insurance</option>
<option>Home Insurance</option>
</select><br>
<input id="date" type="date"><br>
<button onclick="registerPolicy()">Add Policy</button>
<p id="result"></p>
</div>
<script>
function registerPolicy(){
let n=document.getElementById("name").value;
let e=document.getElementById("email").value;
let p=document.getElementById("policy").value;
let d=document.getElementById("date").value;
if(!n||!e||!d){alert("Please fill all fields");return;}
document.getElementById("result").innerHTML=
"Policy Registered Successfully!<br>Customer: "+n+
"<br>Email: "+e+"<br>Policy: "+p+"<br>Due Date: "+d;
}
</script>
</body>
</html>
