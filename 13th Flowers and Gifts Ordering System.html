
<!DOCTYPE html>
<html>
<head>
<title>BlossomGifts</title>
<style>
body{font-family:Arial;text-align:center;background:#fff0f5;padding:20px}
.box{background:white;padding:25px;max-width:450px;margin:auto}
input,select,button{padding:10px;margin:8px;width:80%}
button{background:#d63384;color:white;border:0}
</style>
</head>
<body>
<div class="box">
<h2>BlossomGifts</h2>
<p>Choose your favourite gift</p>
<select id="gift">
<option value="500">Rose Bouquet - Rs.500</option>
<option value="800">Gift Basket - Rs.800</option>
<option value="400">Teddy Bear - Rs.400</option>
</select><br>
<input id="name" placeholder="Customer Name"><br>
<input id="date" type="date"><br>
<button onclick="placeOrder()">Place Order</button>
<p id="result"></p>
</div>
<script>
function placeOrder(){
let n=document.getElementById("name").value;
let g=document.getElementById("gift");
let d=document.getElementById("date").value;
if(!n||!d){alert("Enter all details");return;}
if(d<new Date().toISOString().split("T")[0]){
alert("Choose a future delivery date");return;
}
document.getElementById("result").innerHTML=
"Order Confirmed!<br>Customer: "+n+
"<br>Gift: "+g.options[g.selectedIndex].text+
"<br>Delivery Date: "+d;
}
</script>
</body>
</html>
